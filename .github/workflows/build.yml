name: Build GridOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GridOS.dmg
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build app and DMG
        env:
          VERSION: 1.0.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/package-app.sh

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="1.0.${{ github.run_number }}"
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest \
            "dist/GridOS-$version-macos-arm64.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GridOS $version" \
            --notes "Свежая сборка GridOS. Скачайте .dmg ниже, откройте и перетащите GridOS в «Программы»." \
            --latest
